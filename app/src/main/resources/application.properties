spring.application.name=onward-orders
server.port=${PORT:8080}
server.error.include-message=always

# Browsers must check for a newer page, script or stylesheet before using a cached copy.
# Without this, a release can show the new page with old JavaScript until a hard refresh.
# The check is cheap: an unchanged file answers 304 Not Modified.
spring.web.resources.cache.cachecontrol.no-cache=true

# Display metadata returned by GET /api/info
app.info.student-name=Jado Fils SEZIKEYE
app.info.lab-name=Lab 2 - Delivering Order System Updates Safely
app.info.application-name=Onward Logistics Order System

# Order rules
app.orders.max-recent-orders=50
app.orders.min-quantity=1
app.orders.max-quantity=100

# Which container answered: read from the ECS task metadata endpoint v4, which ECS injects as
# ECS_CONTAINER_METADATA_URI_V4. Off ECS the variable is empty and the host name is shown instead.
app.identity.ecs-metadata-enabled=true
app.identity.metadata-endpoint=${ECS_CONTAINER_METADATA_URI_V4:}
app.identity.metadata-timeout=500ms

# Sales-day CPU spike demo (bounded so it is safe to expose through the UI).
app.load.enabled=${LOAD_DEMO_ENABLED:true}
app.load.min-seconds=30
app.load.max-seconds=600
