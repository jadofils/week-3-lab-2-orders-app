# CD: builds the image and pushes it to Amazon ECR, signing in to AWS with GitHub OIDC
# (no stored AWS keys). It runs only after the CI workflow (ci.yml) has passed on a push to main,
# and it builds exactly the commit that CI tested.
#
# Pushing the "latest" tag fires the EventBridge rule onward-dev-orders-image-pushed, which starts
# CodePipeline: CodeDeploy then releases the image blue/green. Nothing else is triggered from here.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables), not secrets:
#   AWS_ROLE_ARN  output GitHubActionsRoleArn of the onward-dev-registry stack
#   AWS_REGION    eu-west-1
name: Build and push image

on:
  # Starts when CI finishes on main. The job condition below checks that it passed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual run from the Actions tab, on main only: pushes the first image after the
  # registry stack is created, or re-releases the current main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-push-main
  cancel-in-progress: false   # never stop a push halfway; releases queue one after another

env:
  ECR_REPOSITORY: onward-dev-orders

jobs:
  push:
    name: Build and push to ECR
    # Release only when:
    #   - CI passed, for a push (not a pull request) to main of this repository, or
    #   - someone ran this workflow by hand on main.
    # The AWS role also trusts only refs/heads/main of this repository, so other branches,
    # pull requests and forks could not sign in even without this condition.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token
    env:
      # The commit CI tested (workflow_run), or the current main (manual run).
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          TAG="sha-${RELEASE_SHA::7}"
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$RELEASE_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Push sha-<commit>, then latest
        run: |
          # sha- tags are immutable in ECR. On a re-run of the same commit the tag already
          # exists, so skip it and only move latest (which starts the pipeline again).
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "$TAG already in ECR; skipping it"
          else
            docker push "$IMAGE:$TAG"
          fi
          docker push "$IMAGE:latest"

      - name: Summary
        run: |
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "### Pushed to Amazon ECR"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Image: \`$IMAGE:$TAG\` (also \`latest\`)"
            echo "- Digest: \`$DIGEST\`"
            echo "- EventBridge starts \`onward-dev-orders-pipeline\`; CodeDeploy releases it blue/green."
          } >> "$GITHUB_STEP_SUMMARY"
