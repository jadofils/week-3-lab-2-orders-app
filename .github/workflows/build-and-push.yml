# CD: builds the image and pushes it to Amazon ECR, and uploads the deployment bundle
# (deploy/taskdef.json + deploy/appspec.yaml) to S3, signing in to AWS with GitHub OIDC
# (no stored AWS keys). It runs only after the CI workflow (ci.yml) has passed on a push to main,
# and it builds exactly the commit that CI tested.
#
# Order matters: the bundle is uploaded before "latest" is pushed, because pushing "latest" fires the EventBridge rule onward-dev-orders-image-pushed, which starts
# CodePipeline: CodeDeploy then releases the image blue/green. Nothing else is triggered from here.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables), not secrets:
#   AWS_ROLE_ARN  output GitHubActionsRoleArn of the onward-dev-registry stack
#   AWS_REGION    eu-west-1
name: Build and push image

on:
  # Starts when CI finishes on main. The job condition below checks that it passed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual run from the Actions tab, on main only: pushes the first image after the
  # registry stack is created, or re-releases the current main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-push-main
  cancel-in-progress: false   # never stop a push halfway; releases queue one after another

env:
  ECR_REPOSITORY: onward-dev-orders
  BUNDLE_KEY: deploy/deploy-bundle.zip   # bucket: onward-dev-orders-deploy-bundle-<account-id>

jobs:
  push:
    name: Build and push to ECR
    # Release only when:
    #   - CI passed, for a push (not a pull request) to main of this repository, or
    #   - someone ran this workflow by hand on main.
    # The AWS role also trusts only refs/heads/main of this repository, so other branches,
    # pull requests and forks could not sign in even without this condition.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token
    env:
      # The commit CI tested (workflow_run), or the current main (manual run).
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Sign in to AWS with OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Two tags: sha-<commit> (immutable, one per release) and latest (starts the pipeline).
      - name: Build image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: docker build --platform linux/amd64 -t "$IMAGE:sha-${RELEASE_SHA::7}" -t "$IMAGE:latest" .

      - name: Push sha-<commit>
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: docker push "$IMAGE:sha-${RELEASE_SHA::7}"

      # Fill the account and Region into the task definition, zip both files, upload to S3.
      - name: Upload deployment bundle to S3
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          sed -i -e "s/<AWS_ACCOUNT_ID>/$ACCOUNT_ID/g" -e "s/<AWS_REGION>/$REGION/g" deploy/taskdef.json
          (cd deploy && zip -q ../deploy-bundle.zip taskdef.json appspec.yaml)
          aws s3 cp deploy-bundle.zip "s3://onward-dev-orders-deploy-bundle-$ACCOUNT_ID/$BUNDLE_KEY"

      # Last: moving "latest" starts the pipeline, which reads the bundle uploaded above.
      - name: Push latest
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: docker push "$IMAGE:latest"
