# Tests every pull request and push. On main, builds the image and pushes it to Amazon ECR,
# signing in to AWS with GitHub OIDC (no stored AWS keys).
#
# Pushing the "latest" tag fires the EventBridge rule onward-dev-orders-image-pushed, which starts
# CodePipeline: CodeDeploy then releases the image blue/green. Nothing else is triggered from here.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables), not secrets:
#   AWS_ROLE_ARN  output GitHubActionsRoleArn of the onward-dev-registry stack
#   AWS_REGION    eu-west-1
name: Build and push image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: onward-dev-orders

jobs:
  # Fails the run if any credential is committed, in the current files or anywhere in history.
  secret-scan:
    name: Scan for hard-coded credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so a key added and later deleted is still caught

      # gitleaks matches 150+ credential patterns (AWS access keys, private keys, GitHub tokens,
      # passwords in URLs ...). --redact keeps any finding out of the public log.
      - name: gitleaks (all commits)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 \
            git /repo --redact --verbose --exit-code 1

      # The delivery path must stay keyless: no workflow may pass AWS access keys.
      - name: Workflows use OIDC only
        run: |
          # Matches an aws-access-key-id / aws-secret-access-key input, or any expression reading an AWS secret.
          if grep -rnE '^\s*aws-(access-key-id|secret-access-key|session-token):|\$\{\{\s*secrets\.AWS' .github/workflows; then
            echo "::error::A workflow passes AWS access keys. Use role-to-assume (OIDC) instead."
            exit 1
          fi
          echo "No AWS access keys referenced; AWS sign-in is OIDC only."

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: mvn verify
        working-directory: app
        run: mvn -B verify

  push:
    name: Build and push to ECR
    needs: [secret-scan, test]
    # Only main may release. The AWS role also trusts only refs/heads/main, so a pull request
    # could not assume it even if this condition were removed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          TAG="sha-${GITHUB_SHA::7}"
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Push sha-<commit>, then latest
        run: |
          # sha- tags are immutable in ECR. On a re-run of the same commit the tag already
          # exists, so skip it and only move latest (which starts the pipeline again).
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "$TAG already in ECR; skipping it"
          else
            docker push "$IMAGE:$TAG"
          fi
          docker push "$IMAGE:latest"

      - name: Summary
        run: |
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "### Pushed to Amazon ECR"
            echo "- Image: \`$IMAGE:$TAG\` (also \`latest\`)"
            echo "- Digest: \`$DIGEST\`"
            echo "- EventBridge starts \`onward-dev-orders-pipeline\`; CodeDeploy releases it blue/green."
          } >> "$GITHUB_STEP_SUMMARY"
